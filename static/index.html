<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cloudify support assistant powered by retrieval-augmented generation.">
    <title>Cloudify RAG Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="chat-container">
        <header class="chat-header">
            <div class="bot-info">
                <div class="avatar" aria-hidden="true">
                    <span class="avatar-icon">C</span>
                    <span class="status-indicator"></span>
                </div>
                <div>
                    <h1>Cloudify Support</h1>
                    <p><span class="status-dot"></span> RAG-powered knowledge assistant</p>
                </div>
            </div>
            <button class="settings-btn" id="themeToggle" aria-label="Toggle Theme" title="Toggle theme">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </header>

        <section class="chat-box" id="chatBox" aria-live="polite" aria-label="Chat messages">
            <div class="message bot-message">
                <div class="message-content">Hi! I'm the Cloudify knowledge assistant. Ask me about plans, hosting, security, backups, or any other FAQ.</div>
                <div class="message-timestamp">Just now</div>
            </div>
        </section>

        <div class="typing-indicator hidden" id="typingIndicator" aria-label="Assistant is thinking">
            <span></span><span></span><span></span>
        </div>

        <form class="input-area" id="chatForm">
            <input type="text" id="userInput" placeholder="Ask a question about Cloudify..." autocomplete="off" maxlength="2000" required aria-label="Your question">
            <button type="submit" id="sendBtn" aria-label="Send Message">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </form>
        <footer class="chat-footer">Answers are generated from retrieved Cloudify FAQ knowledge.</footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
